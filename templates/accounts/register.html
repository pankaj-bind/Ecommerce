{% extends "base/base.html" %}
{% load static %}
{% block title %}Create Account - BuyNest{% endblock %}
{% block start %}

<style>
  .register-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    padding: 60px 20px;
  }

  .register-card {
    background: white;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    width: 100%;
    max-width: 480px;
  }

  .register-header {
    background: linear-gradient(135deg, #0d9488 0%, #06b6d4 100%);
    padding: 40px;
    text-align: center;
    color: white;
  }

  .register-header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: 8px;
    font-family: 'Inter', sans-serif;
  }

  .register-header p {
    opacity: 0.9;
    font-size: 0.95rem;
    margin: 0;
  }

  .register-body {
    padding: 40px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  .input-group-modern {
    margin-bottom: 20px;
  }

  .input-group-modern label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #374151;
    margin-bottom: 8px;
  }

  .input-group-modern input {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 1rem;
    transition: all 0.3s ease;
  }

  .input-group-modern input:focus {
    outline: none;
    border-color: #0d9488;
    box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1);
  }

  .btn-register {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #0d9488 0%, #06b6d4 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
  }

  .btn-register:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(13, 148, 136, 0.4);
  }

  .register-footer {
    text-align: center;
    margin-top: 25px;
    padding-top: 25px;
    border-top: 1px solid #e5e7eb;
  }

  .register-footer p {
    color: #64748b;
    margin: 0;
  }

  .register-footer a {
    color: #0d9488;
    font-weight: 600;
    text-decoration: none;
  }

  .register-footer a:hover {
    color: #0f766e;
  }

  @media (max-width: 576px) {
    .register-body {
      padding: 30px 25px;
    }
    .form-row {
      grid-template-columns: 1fr;
    }
  }
</style>

<section class="register-section">
  <div class="register-card" data-aos="fade-up">
    <div class="register-header">
      <h1><i class="fas fa-user-plus me-2"></i>Create Account</h1>
      <p>Join BuyNest and start shopping today</p>
    </div>

    <div class="register-body">
      {% include 'base/alert.html' %}

      <form method="POST">
        {% csrf_token %}

        <div class="form-row">
          <div class="input-group-modern">
            <label><i class="fas fa-user me-2"></i>First Name</label>
            <input type="text" name="first_name" placeholder="John" required autocomplete="given-name">
          </div>

          <div class="input-group-modern">
            <label><i class="fas fa-user me-2"></i>Last Name</label>
            <input type="text" name="last_name" placeholder="Doe" required autocomplete="family-name">
          </div>
        </div>

        <div class="input-group-modern">
          <label><i class="fas fa-envelope me-2"></i>Email Address</label>
          <input type="email" name="email" placeholder="john@example.com" required autocomplete="email">
        </div>

        <div class="input-group-modern">
          <label><i class="fas fa-lock me-2"></i>Password</label>
          <input type="password" name="password" placeholder="••••••••" required autocomplete="new-password" minlength="6">
        </div>

        <button type="submit" class="btn-register">
          <i class="fas fa-user-plus me-2"></i>Create Account
        </button>
      </form>

      <div class="register-footer">
        <p>Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
      </div>
    </div>
  </div>
</section>

{% endblock %}
