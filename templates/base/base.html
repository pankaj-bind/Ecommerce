{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="BuyNest - Your Premium Footwear Destination. Shop the latest sneakers, boots, heels, and more for men, women & kids." />
    <meta name="author" content="Pankaj Kumar Bind" />
    <meta name="keywords" content="shoes, sneakers, boots, heels, footwear, men shoes, women shoes, kids shoes, sports shoes, formal shoes" />

    <title>{% block title %}BuyNest | Premium Footwear Store{% endblock %}</title>

    <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Line Icons -->
    <link rel="stylesheet" href="https://cdn.lineicons.com/3.0/lineicons.css" />

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
      :root {
        --primary-color: #0d9488;
        --primary-dark: #0f766e;
        --primary-light: #14b8a6;
        --secondary-color: #06b6d4;
        --accent-color: #f43f5e;
        --success-color: #10b981;
        --warning-color: #f59e0b;
        --dark-color: #1e293b;
        --light-color: #f8fafc;
        --gradient-1: linear-gradient(135deg, #0d9488 0%, #06b6d4 100%);
        --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--light-color);
        color: var(--dark-color);
        line-height: 1.6;
        overflow-x: hidden;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Playfair Display', serif;
        font-weight: 600;
      }

      a {
        text-decoration: none;
      }

      /* Announcement Bar */
      .announcement-bar {
        background: var(--gradient-1);
        color: white;
        padding: 10px 0;
        font-size: 0.875rem;
        font-weight: 500;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .announcement-bar::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        animation: shine 3s infinite;
      }

      @keyframes shine {
        100% { left: 100%; }
      }

      /* Modern Navbar */
      .main-navbar {
        background: white;
        box-shadow: var(--shadow-md);
        padding: 15px 0;
        position: sticky;
        top: 0;
        z-index: 1000;
        transition: all 0.3s ease;
      }

      .main-navbar.scrolled {
        padding: 10px 0;
        box-shadow: var(--shadow-lg);
      }

      .navbar-brand {
        font-family: 'Playfair Display', serif;
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--primary-color) !important;
      }

      .navbar-brand span {
        color: var(--accent-color);
      }

      .nav-link {
        font-weight: 500;
        color: var(--dark-color) !important;
        padding: 10px 20px !important;
        border-radius: 8px;
        transition: all 0.3s ease;
        position: relative;
      }

      .nav-link:hover {
        color: var(--primary-color) !important;
        background: rgba(99, 102, 241, 0.1);
      }

      /* Search Bar */
      .search-container {
        position: relative;
        max-width: 500px;
        width: 100%;
      }

      .search-container input {
        width: 100%;
        padding: 12px 50px 12px 20px;
        border: 2px solid #e2e8f0;
        border-radius: 50px;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        background: #f1f5f9;
      }

      .search-container input:focus {
        outline: none;
        border-color: var(--primary-color);
        background: white;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
      }

      .search-container button {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        background: var(--primary-color);
        border: none;
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .search-container button:hover {
        background: var(--primary-dark);
        transform: translateY(-50%) scale(1.05);
      }

      /* Icon Buttons */
      .icon-btn {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f5f9;
        color: var(--dark-color);
        transition: all 0.3s ease;
        position: relative;
        border: 2px solid transparent;
      }

      .icon-btn:hover {
        background: var(--primary-color);
        color: white;
        transform: translateY(-3px);
        box-shadow: var(--shadow-md);
      }

      .icon-btn .badge {
        position: absolute;
        top: -5px;
        right: -5px;
        background: var(--accent-color);
        color: white;
        font-size: 0.7rem;
        padding: 3px 7px;
        border-radius: 50px;
        font-weight: 600;
      }

      /* Buttons */
      .btn-primary-custom {
        background: var(--gradient-1);
        border: none;
        color: white;
        padding: 12px 30px;
        border-radius: 50px;
        font-weight: 600;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 0.875rem;
      }

      .btn-primary-custom:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        color: white;
      }

      .btn-outline-custom {
        background: transparent;
        border: 2px solid var(--primary-color);
        color: var(--primary-color);
        padding: 12px 30px;
        border-radius: 50px;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .btn-outline-custom:hover {
        background: var(--primary-color);
        color: white;
        transform: translateY(-3px);
      }

      /* Cards */
      .product-card {
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        transition: all 0.4s ease;
        border: 1px solid #e2e8f0;
        height: 100%;
      }

      .product-card:hover {
        transform: translateY(-10px);
        box-shadow: var(--shadow-xl);
      }

      .product-card .card-img-wrapper {
        position: relative;
        overflow: hidden;
        padding-top: 100%;
        background: #f8fafc;
      }

      .product-card .card-img-wrapper img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
      }

      .product-card:hover .card-img-wrapper img {
        transform: scale(1.1);
      }

      .product-card .card-body {
        padding: 20px;
      }

      .product-card .product-title {
        font-size: 1rem;
        font-weight: 600;
        color: var(--dark-color);
        margin-bottom: 8px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
      }

      .product-card .product-price {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--primary-color);
      }

      /* Wishlist Button */
      .wishlist-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: white;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: var(--shadow-md);
        z-index: 10;
      }

      .wishlist-btn:hover {
        background: var(--accent-color);
        color: white;
        transform: scale(1.1);
      }

      /* Section Headers */
      .section-header {
        text-align: center;
        margin-bottom: 50px;
      }

      .section-header h2 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 15px;
        position: relative;
        display: inline-block;
      }

      .section-header h2::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 4px;
        background: var(--gradient-1);
        border-radius: 2px;
      }

      .section-header p {
        color: #64748b;
        font-size: 1.1rem;
        max-width: 600px;
        margin: 20px auto 0;
      }

      /* Footer */
      .modern-footer {
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        color: white;
        padding: 80px 0 0;
      }

      .footer-brand {
        font-family: 'Playfair Display', serif;
        font-size: 2rem;
        font-weight: 700;
        color: white;
        margin-bottom: 20px;
      }

      .footer-brand span {
        color: var(--primary-light);
      }

      .footer-desc {
        color: #94a3b8;
        line-height: 1.8;
        margin-bottom: 25px;
      }

      .footer-heading {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 25px;
        color: white;
        position: relative;
        padding-bottom: 10px;
        font-family: 'Inter', sans-serif;
      }

      .footer-heading::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 40px;
        height: 3px;
        background: var(--primary-color);
        border-radius: 2px;
      }

      .footer-links {
        list-style: none;
        padding: 0;
      }

      .footer-links li {
        margin-bottom: 12px;
      }

      .footer-links a {
        color: #94a3b8;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .footer-links a:hover {
        color: white;
        padding-left: 10px;
      }

      .footer-contact p {
        color: #94a3b8;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .footer-contact i {
        color: var(--primary-light);
        width: 20px;
      }

      .social-links {
        display: flex;
        gap: 12px;
        margin-top: 25px;
      }

      .social-links a {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: rgba(255,255,255,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        transition: all 0.3s ease;
      }

      .social-links a:hover {
        background: var(--primary-color);
        transform: translateY(-5px);
      }

      .footer-bottom {
        border-top: 1px solid rgba(255,255,255,0.1);
        padding: 25px 0;
        margin-top: 60px;
      }

      .footer-bottom p {
        color: #94a3b8;
        margin: 0;
      }

      .footer-bottom a {
        color: var(--primary-light);
      }

      /* Newsletter */
      .newsletter-form {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      .newsletter-form input {
        flex: 1;
        padding: 14px 20px;
        border: none;
        border-radius: 50px;
        background: rgba(255,255,255,0.1);
        color: white;
        font-size: 0.95rem;
      }

      .newsletter-form input::placeholder {
        color: #94a3b8;
      }

      .newsletter-form input:focus {
        outline: none;
        background: rgba(255,255,255,0.15);
      }

      .newsletter-form button {
        padding: 14px 30px;
        border: none;
        border-radius: 50px;
        background: var(--gradient-1);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .newsletter-form button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
      }

      /* Alert Messages */
      .alert-custom {
        border: none;
        border-radius: 15px;
        padding: 15px 25px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        animation: slideIn 0.5s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .alert-success-custom {
        background: rgba(16, 185, 129, 0.1);
        color: var(--success-color);
        border-left: 4px solid var(--success-color);
      }

      .alert-danger-custom {
        background: rgba(244, 63, 94, 0.1);
        color: var(--accent-color);
        border-left: 4px solid var(--accent-color);
      }

      .alert-warning-custom {
        background: rgba(245, 158, 11, 0.1);
        color: var(--warning-color);
        border-left: 4px solid var(--warning-color);
      }

      /* Scroll to Top */
      .scroll-top {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: var(--gradient-1);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        z-index: 1000;
        box-shadow: var(--shadow-lg);
      }

      .scroll-top.visible {
        opacity: 1;
        visibility: visible;
      }

      .scroll-top:hover {
        transform: translateY(-5px);
        color: white;
      }

      /* User Avatar */
      .user-avatar {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--primary-color);
      }

      /* Dropdown Menu */
      .user-dropdown .dropdown-menu {
        border: none;
        border-radius: 15px;
        box-shadow: var(--shadow-xl);
        padding: 10px;
        min-width: 200px;
      }

      .user-dropdown .dropdown-item {
        border-radius: 10px;
        padding: 10px 15px;
        transition: all 0.3s ease;
      }

      .user-dropdown .dropdown-item:hover {
        background: rgba(99, 102, 241, 0.1);
        color: var(--primary-color);
      }

      /* Form Styling */
      .form-control-modern {
        padding: 14px 20px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 0.95rem;
        transition: all 0.3s ease;
      }

      .form-control-modern:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        outline: none;
      }

      /* Page Header */
      .page-header {
        background: var(--gradient-1);
        padding: 60px 0;
        color: white;
        text-align: center;
        margin-bottom: 50px;
      }

      .page-header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      .breadcrumb-modern {
        display: flex;
        justify-content: center;
        gap: 10px;
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .breadcrumb-modern a {
        color: rgba(255,255,255,0.8);
      }

      .breadcrumb-modern a:hover {
        color: white;
      }

      /* Responsive */
      @media (max-width: 991px) {
        .search-container {
          margin: 15px 0;
        }
        
        .section-header h2 {
          font-size: 2rem;
        }
      }

      @media (max-width: 767px) {
        .announcement-bar {
          font-size: 0.75rem;
          padding: 8px 0;
        }

        .section-header h2 {
          font-size: 1.75rem;
        }

        .newsletter-form {
          flex-direction: column;
        }

        .modern-footer {
          padding: 50px 0 0;
        }

        .page-header {
          padding: 40px 0;
        }

        .page-header h1 {
          font-size: 1.75rem;
        }
      }
    </style>

    {% block extra_css %}{% endblock %}
  </head>

  <body>


    {% include 'home/navbar.html' %}
    
    {% block start %}{% endblock %}
    
    {% include 'home/footer.html' %}

    <!-- Scroll to Top Button -->
    <a href="#" class="scroll-top" id="scrollTop">
      <i class="fas fa-chevron-up"></i>
    </a>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AOS Animation -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
      // Initialize AOS
      AOS.init({
        duration: 800,
        easing: 'ease-out',
        once: true
      });

      // Scroll to Top Button
      const scrollTopBtn = document.getElementById('scrollTop');
      window.addEventListener('scroll', () => {
        if (window.pageYOffset > 300) {
          scrollTopBtn.classList.add('visible');
        } else {
          scrollTopBtn.classList.remove('visible');
        }
      });

      scrollTopBtn.addEventListener('click', (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // Navbar scroll effect
      const navbar = document.querySelector('.main-navbar');
      if (navbar) {
        window.addEventListener('scroll', () => {
          if (window.pageYOffset > 50) {
            navbar.classList.add('scrolled');
          } else {
            navbar.classList.remove('scrolled');
          }
        });
      }
    </script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
